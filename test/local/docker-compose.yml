services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:0.39.6
    container_name: pocketbase-mcp-test
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    environment:
      - POCKETBASE_LOG_LEVEL=4
    command: serve --http=0.0.0.0:8090
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pb_data:
